<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mine-clone</title>
<style>
  /* TOUCH UI */

#touch-ui{
position:fixed;
inset:0;
pointer-events:none;
font-family:Arial;
display:none;   /* HIDE by default */
}

/* joystick */

#joystick{
position:absolute;
bottom:35px;
left:35px;
width:140px;
height:140px;
border-radius:50%;
background:rgba(255,255,255,0.08);
border:2px solid rgba(255,255,255,0.25);
backdrop-filter: blur(4px);
pointer-events:auto;
}

#stick{
position:absolute;
left:50px;
top:50px;
width:40px;
height:40px;
border-radius:50%;
background:rgba(255,255,255,0.9);
box-shadow:0 0 10px rgba(255,255,255,0.6);
}

/* look area */

#touch-look{
position:absolute;
right:0;
top:0;
width:60%;
height:100%;
pointer-events:auto;
}

/* buttons */

#jumpBtn,#breakBtn,#placeBtn{
position:absolute;
right:25px;
width:70px;
height:70px;
border:none;
border-radius:50%;
background:rgba(255,255,255,0.15);
border:2px solid rgba(255,255,255,0.35);
color:white;
font-weight:bold;
pointer-events:auto;
backdrop-filter: blur(4px);
}

#jumpBtn{ bottom:140px; font-size:18px; }
#breakBtn{ bottom:60px; font-size:14px; }
#placeBtn{ bottom:60px; right:110px; font-size:14px; }
canvas { display:block; }

#crosshair{
  position:fixed;
  left:50%; top:50%;
  width:14px; height:14px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
#crosshair::before,#crosshair::after{
  content:"";
  position:absolute;
  background:white;
}
#crosshair::before{ left:6px; top:0; width:2px; height:14px; }
#crosshair::after{ top:6px; left:0; width:14px; height:2px; }

#hotbar{
  position:fixed; bottom:10px; left:50%;
  transform:translateX(-50%);
  display:flex; gap:5px;
}
.hotbar-slot{
  width:40px; height:40px;
  border:2px solid white;
  background:rgba(0, 0, 0, 0.4);
}
.hotbar-slot.active{ border-color:yellow; }

#start{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.6);
  color:white; font-size:32px;
  cursor:pointer; z-index:10;
  font-family:Arial;
}
/* SHOW TOUCH CONTROLS ONLY ON TOUCH DEVICES */
@media (hover:none) and (pointer:coarse){
  #touch-ui{ display:block; }
}

</style>
</head>
<body>

<div id="start">CLICK TO START</div>
<div id="crosshair"></div>
<div id="hotbar">
  <div class="hotbar-slot active"></div>
  <div class="hotbar-slot"></div>
  <div class="hotbar-slot"></div>
  <div class="hotbar-slot"></div>
  <div class="hotbar-slot"></div>
</div>

<div id="touch-ui">

<div id="joystick">
<div id="stick"></div>
</div>

<div id="touch-look"></div>

<button id="jumpBtn">↑</button>
<button id="breakBtn">⛏</button>
<button id="placeBtn">⬛</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="script.js"></script>

<script>
</script>
</body>
</html>
